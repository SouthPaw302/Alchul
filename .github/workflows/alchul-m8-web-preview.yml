name: Alchul M8 Web preview (candidate, not Pages release)
on:
  pull_request:
    paths:
      - "godot/**"
      - ".github/workflows/alchul-m8-web-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq curl unzip
      - name: Export candidate from actual Godot 4 project
        run: bash godot/tools/build_web.sh
      - name: Validate browser bundle integrity
        run: |
          set -euo pipefail
          test -s godot/build/web/index.html
          test -s godot/build/web/index.wasm
          test -s godot/build/web/index.pck
          test -s godot/build/web/index.js
          sha256sum godot/build/web/index.html godot/build/web/index.js godot/build/web/index.wasm godot/build/web/index.pck > godot/build/web/SHA256SUMS.txt
          du -h godot/build/web/* | head -20
      - name: Preserve Web export before browser test
        uses: actions/upload-artifact@v4
        with:
          name: alchul-m8-godot-web-preview
          path: godot/build/web/
          if-no-files-found: error
          retention-days: 21
      - name: Prepare Chromium browser smoke
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test actual browser-rendered Godot build
        env:
          ALCHUL_M8_BROWSER_DIR: ${{ github.workspace }}/m8-browser
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --directory godot/build/web >/tmp/alchul-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in $(seq 1 25); do
            if curl --fail -s http://127.0.0.1:8765/ >/dev/null; then break; fi
            sleep 1
          done
          node godot/tests/browser_m8.cjs http://127.0.0.1:8765/
      - name: Preserve WebGL2 screenshot and frame evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alchul-m8-chromium-browser-review
          path: m8-browser/
          if-no-files-found: warn
          retention-days: 21
