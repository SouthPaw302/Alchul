name: Publish Alchul Godot World (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "godot/**"
      - ".github/workflows/alchul-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "alchul-pages"
  cancel-in-progress: false

jobs:
  publish-alchul:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out authoritative Alchul only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Choose proven bundle only when source is unchanged
        id: source
        shell: bash
        run: |
          set -euo pipefail
          VERIFIED_SOURCE="105f496e06b86cd5a043f254c45f385279bc629d"
          if git diff --quiet "$VERIFIED_SOURCE" HEAD -- godot/; then
            echo "reuse=true" >> "$GITHUB_OUTPUT"
            echo "Alchul Godot source is identical to the independently verified Web export."
          else
            echo "reuse=false" >> "$GITHUB_OUTPUT"
            echo "Godot source has changed; building fresh from the current commit."
          fi

      - name: Restore independently verified Alchul Godot Web bundle
        if: steps.source.outputs.reuse == 'true'
        uses: actions/download-artifact@v4
        with:
          name: alchul-godot-web
          repository: SouthPaw302/Alchul
          run-id: 42579321714
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: godot/build/web

      - name: Install engine-download utilities for changed sources
        if: steps.source.outputs.reuse != 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq curl unzip

      - name: Build updated world from local Alchul sources
        if: steps.source.outputs.reuse != 'true'
        run: bash godot/tools/build_web.sh

      - name: Verify the website bundle before publishing
        shell: bash
        run: |
          set -euo pipefail
          python3 godot/tools/validate_worldbook.py
          test -s godot/build/web/index.html
          test -s godot/build/web/index.js
          test -s godot/build/web/index.pck
          test -s godot/build/web/index.wasm
          grep -qi "alchul" godot/build/web/index.html
          echo "ALCHUL PAGE BUNDLE VALIDATED"

      - name: Configure repository GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload verified Godot site files
        uses: actions/upload-pages-artifact@v4
        with:
          path: godot/build/web

      - name: Publish Alchul to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
