name: ALCHUL T08-T09 — real Godot analysis views
on:
  pull_request:
    paths:
      - "godot/data/m11_t08_t09_*.json"
      - "godot/scripts/m11_t08_t09_lab.gd"
      - "godot/scenes/m11_t08_t09_lab.tscn"
      - "godot/tests/render_m11_t08_t09.gd"
      - ".github/workflows/alchul-t08-t09-capture.yml"
  push:
    branches: [main]
    paths:
      - "godot/data/m11_t08_t09_*.json"
      - "godot/scripts/m11_t08_t09_lab.gd"
      - "godot/scenes/m11_t08_t09_lab.tscn"
      - ".github/workflows/alchul-t08-t09-capture.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned Godot and Xvfb
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl unzip xvfb libgl1-mesa-dri
          curl -fL --retry 3 "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" -o "$RUNNER_TEMP/godot.zip"
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $RUNNER_TEMP/godot.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64"
      - name: Import Godot scene
        run: "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --headless --path godot --editor --import --quit
      - name: Render native engine screenshots
        shell: bash
        env:
          ALCHUL_T08_T09_CAPTURES: ${{ github.workspace }}/t08-t09-captures
        run: |
          set -euo pipefail
          mkdir -p "$ALCHUL_T08_T09_CAPTURES"
          xvfb-run -a -s "-screen 0 1280x720x24" \
            "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --path godot \
            --script res://tests/render_m11_t08_t09.gd
          test -s "$ALCHUL_T08_T09_CAPTURES/01_neutral_near.png"
          test -s "$ALCHUL_T08_T09_CAPTURES/02_one_foot_far.png"
      - uses: actions/upload-artifact@v4
        with:
          name: m11-t08-t09-real-godot-preview
          path: t08-t09-captures/
          if-no-files-found: error
          retention-days: 60
