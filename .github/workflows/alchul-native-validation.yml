name: Alchul independent Godot foundation
on:
  push:
    branches: [main]
    paths:
      - "godot/**"
      - ".github/workflows/alchul-native-validation.yml"
      - "CENTRALIZATION.md"
  pull_request:
    paths:
      - "godot/**"
      - ".github/workflows/alchul-native-validation.yml"
      - "CENTRALIZATION.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out Alchul only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify scene data and local-only dependencies
        run: |
          python3 godot/tools/validate_worldbook.py
          python3 godot/tools/validate_m11_anatomy.py
          python3 godot/tools/validate_m11_t07_skeleton.py
          python3 godot/tools/m11_t08_t09_analysis.py --check
          python3 -m unittest discover -s godot/tests -p 'test_m11_t08_t09.py'
          python3 godot/tools/m11_t10_mechanics.py --check
          python3 -m unittest discover -s godot/tests -p 'test_m11_t10_mechanics.py'
          python3 godot/tools/m11_t11_reproduction.py --check
          python3 -m unittest discover -s godot/tests -p 'test_m11_t11_reproduction.py'
          python3 godot/tools/validate_m11_t12_science_first.py --check
          python3 godot/tools/validate_m11_t14_anatomy.py
          python3 -m unittest discover -s godot/tests -p 'test_m11_t14_anatomy.py'
          python3 godot/tools/validate_m11_t15_geometry.py
          python3 -m unittest discover -s godot/tests -p 'test_m11_t15_geometry.py'
          python3 godot/tools/m11_t16_evolutionary_models.py --check
          python3 godot/tools/m11_t17_sensing.py
          python3 -m unittest discover -s godot/tests -p 'test_m11_t12_science_first.py'

      - name: Archive T11 research-only sources and recorded assumptions
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: alchul-m11-t11-provisional-source
          path: |
            MEDIA/M11_T11_REPRODUCTIVE_GAS_NURSERY_CONSTRAINTS.md
            godot/data/m11_t11_reproductive_constraints.json
            godot/data/m11_t11_screening_results.json
            godot/tools/m11_t11_reproduction.py
            godot/scripts/m11_t11_reproductive_lab.gd
            godot/scenes/m11_t11_reproductive_lab.tscn
            godot/tests/test_m11_t11_reproduction.py
            godot/tests/m11_t11_lab_smoke.gd
            godot/tests/render_m11_t11.gd
          if-no-files-found: error
          retention-days: 90

      - name: Archive T12 science-first sources, period register and six candidate studies
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: alchul-m11-t12-science-first-source
          path: |
            RESEARCH/SCIENCE_FIRST_EARTH_TO_PRESENT_T12.md
            MEDIA/M11_T12_SIX_INHABITANTS_SCIENCE_FIRST_ATLAS.md
            godot/data/m11_t12_real_earth_timeline.json
            godot/data/m11_t12_inhabitant_candidates.json
            godot/tools/validate_m11_t12_science_first.py
            godot/tests/test_m11_t12_science_first.py
            godot/tests/m11_t12_lab_smoke.gd
            godot/tests/render_m11_t12.gd
            godot/scripts/m11_t12_era_people_lab.gd
            godot/scenes/m11_t12_era_people_lab.tscn
          if-no-files-found: error
          retention-days: 90

      - name: Archive T13 skinned rig, evidence and procedural animation sources
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: alchul-m11-t13-provisional-rig-source
          path: |
            MEDIA/M11_T13_PROVISIONAL_SKINNED_RIG_AND_CONTEXT_GATES.md
            godot/scripts/m11_t13_skinned_character_lab.gd
            godot/scenes/m11_t13_skinned_character_lab.tscn
            godot/tests/m11_t13_skinned_lab_smoke.gd
            godot/tests/render_m11_t13.gd
            godot/tests/export_m11_t13_glb.gd
          if-no-files-found: error
          retention-days: 90

      - name: Archive T14 evidence, validation and noncanonical viewer sources
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: alchul-m11-t14-creator-review-source
          path: |
            MEDIA/M11_T14_CREATOR_ANATOMY_REVIEW_AND_DECISION_GATES.md
            godot/data/m11_t14_anatomy_review.json
            godot/tools/validate_m11_t14_anatomy.py
            godot/tests/test_m11_t14_anatomy.py
            godot/scripts/m11_t14_creator_anatomy_review.gd
            godot/scenes/m11_t14_creator_anatomy_review.tscn
            godot/tests/m11_t14_review_smoke.gd
            godot/tests/render_m11_t14.gd
          if-no-files-found: error
          retention-days: 90

      - name: Archive T15 original settlement mesh QA, sources and strict uncertainty gates
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: alchul-m11-t15-original-settlement-probe-source
          path: |
            MEDIA/M11_T15_ORIGINAL_SETTLEMENT_GEOMETRY_AND_BODY_PROBES.md
            godot/data/m11_t15_settlement_probes.json
            godot/tools/validate_m11_t15_geometry.py
            godot/tests/test_m11_t15_geometry.py
            godot/scripts/m11_t15_settlement_geometry_lab.gd
            godot/scenes/m11_t15_settlement_geometry_lab.tscn
            godot/tests/m11_t15_settlement_smoke.gd
            godot/tests/render_m11_t15.gd
          if-no-files-found: error
          retention-days: 90

      - name: Archive T16 evolutionary morphometry source, three-dimensional prototypes and study tests
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: alchul-m11-t16-evolutionary-inhabitant-source
          path: |
            MEDIA/M11_T16_EVOLUTIONARY_INHABITANT_MODELS.md
            godot/data/m11_t16_evolutionary_profiles.json
            godot/tools/m11_t16_evolutionary_models.py
            godot/scripts/m11_t16_evolutionary_lab.gd
            godot/scripts/m11_t16_experimental_inhabitants.gd
            godot/scenes/m11_t16_evolutionary_lab.tscn
            godot/scenes/m11_t16_experimental_inhabitants.tscn
            godot/tests/m11_t16_evolutionary_smoke.gd
            godot/tests/m11_t16_actor_integration_smoke.gd
            godot/tests/render_m11_t16.gd
            godot/tests/render_m11_t16_evolutionary.gd
            godot/tests/export_m11_t16_evolutionary_glb.gd
            godot/tools/m11_t16_export_glb.py
            godot/tests/verify_m11_t16_exported_glb.gd
          if-no-files-found: error
          retention-days: 90

      - name: Archive T17 causal physical sensing sources and scientific boundaries
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: alchul-m11-t17-causal-physical-sensing-source
          path: |
            MEDIA/M11_T17_PHYSICAL_SENSING_CAUSAL_ENGINE.md
            godot/data/m11_t17_physical_sensing.json
            godot/tools/m11_t17_sensing.py
            godot/scripts/m11_t17_physical_sensing_lab.gd
            godot/scenes/m11_t17_physical_sensing_lab.tscn
            godot/tests/m11_t17_sensing_smoke.gd
            godot/tests/render_m11_t17.gd
          if-no-files-found: error
          retention-days: 90

  godot-native-smoke:
    needs: offline-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out Alchul only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install official pinned Godot 4 toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl unzip
          curl -fL --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" \
            -o "$RUNNER_TEMP/godot.zip"
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $RUNNER_TEMP/godot.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64"
      - name: Import native Alchul Godot project
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --headless \
            --path godot --editor --import --quit
      - name: Parse the new chapter and field-map GDScript directly
        shell: bash
        run: |
          set -euo pipefail
          for script in res://scripts/game_map.gd res://scripts/game_loop.gd res://scripts/world.gd; do
            "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --headless \
              --path godot --check-only --script "$script"
          done

      - name: Test scene, visitor, data and interpretation switching
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --headless \
            --path godot --script res://tests/smoke.gd

      - name: Verify M10 source GLB, all 28 PNG hashes, and native materials
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --headless \
            --path godot --script res://tests/m10_import_smoke.gd

      - name: Prove M10 source-station mesh consolidation preserves triangles
        shell: bash
        env:
          ALCHUL_M10_STATIC_BATCH: "1"
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --headless \
            --path godot --script res://tests/m10_static_batch_smoke.gd

      - name: Verify completed Braided Reach game loop, local save and ending
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --headless \
            --path godot --script res://tests/chapter_full_loop_smoke.gd

      - name: Validate Chapter I 1.1 navigation, paired-control gameplay, save and release invariants
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --headless --path godot \
            --check-only --script res://scripts/chapter_signal_instrument.gd
          "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --headless --path godot \
            --check-only --script res://scripts/chapter_game_v2.gd
          "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --headless --path godot \
            --check-only --script res://scripts/chapter_atmosphere_v2.gd
          "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --headless --path godot \
            --script res://tests/chapter_v2_play_smoke.gd

      - name: Parse and smoke test separate M11 noncanonical anatomy lab
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --headless \
            --path godot --check-only --script res://scripts/m11_anatomy_lab.gd
          "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --headless \
            --path godot --script res://tests/m11_anatomy_lab_smoke.gd

      - name: Parse T07 Skeleton3D graph and test bounded pose controls
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --headless \
            --path godot --check-only --script res://scripts/m11_t07_joint_lab.gd
          "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --headless \
            --path godot --script res://tests/m11_t07_joint_smoke.gd

      - name: Test T08-T09 native center-of-mass and three-digit visual analysis scene
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --headless \
            --path godot --check-only --script res://scripts/m11_t08_t09_lab.gd
          "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --headless \
            --path godot --script res://tests/m11_t08_t09_lab_smoke.gd

      - name: Validate T10 corridor debug and noncanonical force study
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --headless \
            --path godot --check-only --script res://scripts/m11_t10_corridor_lab.gd
          "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --headless \
            --path godot --script res://tests/m11_t10_lab_smoke.gd

      - name: Check T11 research-only gas/burden/nursery screen in native Godot
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --headless             --path godot --check-only --script res://scripts/m11_t11_reproductive_lab.gd
          "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --headless             --path godot --script res://tests/m11_t11_lab_smoke.gd

      - name: Validate T12 real-Earth through modern 2026 and six-person native research atlas
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --headless --path godot             --check-only --script res://scripts/m11_t12_era_people_lab.gd
          "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --headless --path godot             --script res://tests/m11_t12_lab_smoke.gd

      - name: Parse and smoke test T13 skinned, animated provisional surface bodies
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --headless --path godot \
            --check-only --script res://scripts/m11_t13_skinned_character_lab.gd
          "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --headless --path godot \
            --script res://tests/m11_t13_skinned_lab_smoke.gd

      - name: Export T13 reproducible skin-weighted H-A and H-B GLBs and round-trip
        shell: bash
        env:
          ALCHUL_T13_EXPORTS: ${{ github.workspace }}/m11-t13-glb
        run: |
          set -euo pipefail
          mkdir -p "$ALCHUL_T13_EXPORTS"
          "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --headless --path godot \
            --script res://tests/export_m11_t13_glb.gd
          test -s "$ALCHUL_T13_EXPORTS/ALCHUL_T13_H-A_provisional_skin.glb"
          test -s "$ALCHUL_T13_EXPORTS/ALCHUL_T13_H-B_provisional_skin.glb"
          test -s "$ALCHUL_T13_EXPORTS/export_manifest.json"

      - name: Archive T13 skinned GLB exports independently
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: alchul-m11-t13-skinned-glb-exports
          path: m11-t13-glb/
          if-no-files-found: error
          retention-days: 90

      - name: Verify T14 creator anatomy comparison and no-approval invariants
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --headless --path godot \
            --check-only --script res://scripts/m11_t14_creator_anatomy_review.gd
          "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --headless --path godot \
            --script res://tests/m11_t14_review_smoke.gd

      - name: Test T15 actual M2-M5 original GLB physics triangles and synthetic body probes
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --headless --path godot \
            --check-only --script res://scripts/m11_t15_settlement_geometry_lab.gd
          "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --headless --path godot \
            --script res://tests/m11_t15_settlement_smoke.gd

      - name: Validate T16 three evolutionary 43-control weighted meshes and default-disabled playable game hook
        shell: bash
        run: |
          set -euo pipefail
          for script in res://scripts/m11_t16_evolutionary_lab.gd res://scripts/m11_t16_experimental_inhabitants.gd res://scripts/world.gd; do
            "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --headless --path godot --check-only --script "$script"
          done
          "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --headless --path godot --script res://tests/m11_t16_evolutionary_smoke.gd
          "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --headless --path godot --script res://tests/m11_t16_actor_integration_smoke.gd

      - name: Generate three actual glTF2 skin-weighted GLBs using deterministic source geometry
        shell: bash
        env:
          ALCHUL_T16_EVOLUTIONARY_EXPORTS: ${{ github.workspace }}/m11-t16-evolved-glb
        run: |
          set -euo pipefail
          python3 godot/tools/m11_t16_export_glb.py --out "$ALCHUL_T16_EVOLUTIONARY_EXPORTS"
          for hypothesis in E1 E2 E3; do
            test -s "$ALCHUL_T16_EVOLUTIONARY_EXPORTS/ALCHUL_T16_${hypothesis}_evolutionary_hypothesis.glb"
          done
          test -s "$ALCHUL_T16_EVOLUTIONARY_EXPORTS/model_manifest.json"
          "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --headless --path godot --script res://tests/verify_m11_t16_exported_glb.gd

      - name: Archive T16 three separately editable weighted skinned GLB reconstructions
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: alchul-m11-t16-three-evolutionary-skinned-glbs
          path: m11-t16-evolved-glb/
          if-no-files-found: error
          retention-days: 90

      - name: Test T17 source→reader physical detection, attenuation and deliberate false alarms
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --headless --path godot \
            --check-only --script res://scripts/m11_t17_physical_sensing_lab.gd
          "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --headless --path godot \
            --script res://tests/m11_t17_sensing_smoke.gd

      - name: Verify every original M1–M6 GLB in live game and preserve exact mesh triangle counts
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --headless \
            --path godot --script res://tests/original_media_atlas_smoke.gd

  m11-native-captures:
    needs: offline-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
      ALCHUL_T07_CAPTURES: ${{ github.workspace }}/m11-native-captures/t07
      ALCHUL_T08_T09_CAPTURES: ${{ github.workspace }}/m11-native-captures/t08-t09
      ALCHUL_T10_CAPTURES: ${{ github.workspace }}/m11-native-captures/t10
      ALCHUL_T11_CAPTURES: ${{ github.workspace }}/m11-native-captures/t11
      ALCHUL_T12_CAPTURES: ${{ github.workspace }}/m11-native-captures/t12
      ALCHUL_T13_CAPTURES: ${{ github.workspace }}/m11-native-captures/t13
      ALCHUL_T14_CAPTURES: ${{ github.workspace }}/m11-native-captures/t14
      ALCHUL_T15_CAPTURES: ${{ github.workspace }}/m11-native-captures/t15
      ALCHUL_T16_CAPTURES: ${{ github.workspace }}/m11-native-captures/t16
      ALCHUL_T16_EVOLUTIONARY_CAPTURES: ${{ github.workspace }}/m11-native-captures/t16-evolutionary
      ALCHUL_T17_CAPTURES: ${{ github.workspace }}/m11-native-captures/t17
    steps:
      - name: Check out Alchul only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned Godot and native virtual display
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl unzip xvfb libgl1-mesa-dri libglu1-mesa libxrandr2
          curl -fL --retry 3 "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" -o "$RUNNER_TEMP/godot.zip"
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $RUNNER_TEMP/godot.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64"
      - name: Import original game and research labs in native Godot
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --headless \
            --path godot --editor --import --quit
      - name: Capture T07, T08–T09 and T10 real-engine study views
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ALCHUL_T07_CAPTURES" "$ALCHUL_T08_T09_CAPTURES" "$ALCHUL_T10_CAPTURES" "$ALCHUL_T11_CAPTURES" "$ALCHUL_T12_CAPTURES" "$ALCHUL_T13_CAPTURES" "$ALCHUL_T14_CAPTURES" "$ALCHUL_T15_CAPTURES" "$ALCHUL_T16_CAPTURES" "$ALCHUL_T16_EVOLUTIONARY_CAPTURES" "$ALCHUL_T17_CAPTURES"
          for script in render_m11_t07.gd render_m11_t08_t09.gd render_m11_t10.gd render_m11_t11.gd render_m11_t12.gd render_m11_t13.gd render_m11_t14.gd render_m11_t15.gd render_m11_t16.gd render_m11_t16_evolutionary.gd render_m11_t17.gd; do
            xvfb-run -a -s '-screen 0 1280x720x24' \
              "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" \
              --path godot --rendering-method gl_compatibility \
              --script "res://tests/$script"
          done
          test -s "$ALCHUL_T07_CAPTURES/01_comparison.png"
          test -s "$ALCHUL_T07_CAPTURES/02_H-A.png"
          test -s "$ALCHUL_T07_CAPTURES/03_H-B.png"
          test -s "$ALCHUL_T08_T09_CAPTURES/01_neutral_near.png"
          test -s "$ALCHUL_T08_T09_CAPTURES/02_one_foot_far.png"
          test -s "$ALCHUL_T10_CAPTURES/01_width_2p8.png"
          test -s "$ALCHUL_T10_CAPTURES/02_width_4p6.png"
