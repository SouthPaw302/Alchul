name: Alchul independent Godot foundation
on:
  push:
    branches: [main]
    paths:
      - "godot/**"
      - ".github/workflows/alchul-native-validation.yml"
      - "CENTRALIZATION.md"
  pull_request:
    paths:
      - "godot/**"
      - ".github/workflows/alchul-native-validation.yml"
      - "CENTRALIZATION.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out Alchul only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9e0cfa4b4 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify scene data and local-only dependencies
        run: python3 godot/tools/validate_worldbook.py

  godot-native-smoke:
    needs: offline-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out Alchul only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9e0cfa4b4 # v4.2.2
        with:
          persist-credentials: false
      - name: Install official pinned Godot 4 toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl unzip
          curl -fL --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" \
            -o "$RUNNER_TEMP/godot.zip"
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $RUNNER_TEMP/godot.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64"
      - name: Import native Alchul Godot project
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --headless \
            --path godot --editor --import --quit
      - name: Test scene, visitor, data and interpretation switching
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --headless \
            --path godot --script res://tests/smoke.gd
