name: Alchul independent Godot foundation
on:
  push:
    branches: [main]
    paths:
      - "godot/**"
      - ".github/workflows/alchul-native-validation.yml"
      - "CENTRALIZATION.md"
  pull_request:
    paths:
      - "godot/**"
      - ".github/workflows/alchul-native-validation.yml"
      - "CENTRALIZATION.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out Alchul only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify scene data and local-only dependencies
        run: |
          python3 godot/tools/validate_worldbook.py
          python3 godot/tools/validate_m11_anatomy.py
          python3 godot/tools/validate_m11_t07_skeleton.py
          python3 godot/tools/m11_t08_t09_analysis.py --check
          python3 -m unittest discover -s godot/tests -p 'test_m11_t08_t09.py'
          python3 godot/tools/m11_t10_mechanics.py --check
          python3 -m unittest discover -s godot/tests -p 'test_m11_t10_mechanics.py'
          python3 godot/tools/m11_t11_reproduction.py --check
          python3 -m unittest discover -s godot/tests -p 'test_m11_t11_reproduction.py'

  godot-native-smoke:
    needs: offline-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out Alchul only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install official pinned Godot 4 toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl unzip
          curl -fL --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" \
            -o "$RUNNER_TEMP/godot.zip"
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $RUNNER_TEMP/godot.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64"
      - name: Import native Alchul Godot project
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --headless \
            --path godot --editor --import --quit
      - name: Parse the new chapter and field-map GDScript directly
        shell: bash
        run: |
          set -euo pipefail
          for script in res://scripts/game_map.gd res://scripts/game_loop.gd res://scripts/world.gd; do
            "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --headless \
              --path godot --check-only --script "$script"
          done

      - name: Test scene, visitor, data and interpretation switching
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --headless \
            --path godot --script res://tests/smoke.gd

      - name: Verify M10 source GLB, all 28 PNG hashes, and native materials
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --headless \
            --path godot --script res://tests/m10_import_smoke.gd

      - name: Prove M10 source-station mesh consolidation preserves triangles
        shell: bash
        env:
          ALCHUL_M10_STATIC_BATCH: "1"
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --headless \
            --path godot --script res://tests/m10_static_batch_smoke.gd

      - name: Verify completed Braided Reach game loop, local save and ending
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --headless \
            --path godot --script res://tests/chapter_full_loop_smoke.gd

      - name: Parse and smoke test separate M11 noncanonical anatomy lab
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --headless \
            --path godot --check-only --script res://scripts/m11_anatomy_lab.gd
          "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --headless \
            --path godot --script res://tests/m11_anatomy_lab_smoke.gd

      - name: Parse T07 Skeleton3D graph and test bounded pose controls
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --headless \
            --path godot --check-only --script res://scripts/m11_t07_joint_lab.gd
          "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --headless \
            --path godot --script res://tests/m11_t07_joint_smoke.gd

      - name: Test T08-T09 native center-of-mass and three-digit visual analysis scene
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --headless \
            --path godot --check-only --script res://scripts/m11_t08_t09_lab.gd
          "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --headless \
            --path godot --script res://tests/m11_t08_t09_lab_smoke.gd

      - name: Validate T10 corridor debug and noncanonical force study
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --headless \
            --path godot --check-only --script res://scripts/m11_t10_corridor_lab.gd
          "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --headless \
            --path godot --script res://tests/m11_t10_lab_smoke.gd

      - name: Check T11 research-only gas/burden/nursery screen in native Godot
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --headless             --path godot --check-only --script res://scripts/m11_t11_reproductive_lab.gd
          "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --headless             --path godot --script res://tests/m11_t11_lab_smoke.gd

      - name: Verify every original M1–M6 GLB in live game and preserve exact mesh triangle counts
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --headless \
            --path godot --script res://tests/original_media_atlas_smoke.gd

  m11-native-captures:
    needs: offline-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
      ALCHUL_T07_CAPTURES: ${{ github.workspace }}/m11-native-captures/t07
      ALCHUL_T08_T09_CAPTURES: ${{ github.workspace }}/m11-native-captures/t08-t09
      ALCHUL_T10_CAPTURES: ${{ github.workspace }}/m11-native-captures/t10
      ALCHUL_T11_CAPTURES: ${{ github.workspace }}/m11-native-captures/t11
    steps:
      - name: Check out Alchul only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned Godot and native virtual display
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl unzip xvfb libgl1-mesa-dri libglu1-mesa libxrandr2
          curl -fL --retry 3 "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" -o "$RUNNER_TEMP/godot.zip"
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $RUNNER_TEMP/godot.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64"
      - name: Import original game and research labs in native Godot
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --headless \
            --path godot --editor --import --quit
      - name: Capture T07, T08–T09 and T10 real-engine study views
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ALCHUL_T07_CAPTURES" "$ALCHUL_T08_T09_CAPTURES" "$ALCHUL_T10_CAPTURES" "$ALCHUL_T11_CAPTURES"
          for script in render_m11_t07.gd render_m11_t08_t09.gd render_m11_t10.gd render_m11_t11.gd; do
            xvfb-run -a -s '-screen 0 1280x720x24' \
              "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" \
              --path godot --rendering-method gl_compatibility \
              --script "res://tests/$script"
          done
          test -s "$ALCHUL_T07_CAPTURES/01_comparison.png"
          test -s "$ALCHUL_T07_CAPTURES/02_H-A.png"
          test -s "$ALCHUL_T07_CAPTURES/03_H-B.png"
          test -s "$ALCHUL_T08_T09_CAPTURES/01_neutral_near.png"
          test -s "$ALCHUL_T08_T09_CAPTURES/02_one_foot_far.png"
          test -s "$ALCHUL_T10_CAPTURES/01_width_2p8.png"
          test -s "$ALCHUL_T10_CAPTURES/02_width_4p6.png"
          test -s "$ALCHUL_T07_CAPTURES/render_manifest.json"
          test -s "$ALCHUL_T08_T09_CAPTURES/capture_manifest.json"
          test -s "$ALCHUL_T10_CAPTURES/native_manifest.json"
          test -s "$ALCHUL_T11_CAPTURES/01_reference_screen.png"
          test -s "$ALCHUL_T11_CAPTURES/02_internal_hypoxia_screen.png"
          test -s "$ALCHUL_T11_CAPTURES/render_manifest.json"
          echo "ALCHUL M11 NINE NATIVE ENGINE CAPTURES PASS"
      - name: Retain all nine real Godot views and provenance manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alchul-m11-t07-t11-native-engine-evidence
          path: m11-native-captures/
          if-no-files-found: warn
          retention-days: 90
