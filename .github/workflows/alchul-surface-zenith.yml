name: ALCHUL Surface Zenith — concept-to-3D native Godot
on:
  pull_request:
    paths:
      - "godot/scripts/surface_zenith*.gd"
      - "godot/scenes/surface_zenith*.tscn"
      - "godot/tests/*surface_zenith*.gd"
      - ".github/workflows/alchul-surface-zenith.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  zenith:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
      ALCHUL_ZENITH_GLB_DIR: ${{ github.workspace }}/zenith-glb
      ALCHUL_ZENITH_CAPTURES: ${{ github.workspace }}/zenith-renders
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install official pinned Godot 4.7.2 and virtual X display
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl unzip xvfb libgl1-mesa-dri libglu1-mesa libxrandr2
          curl -fL --retry 3 "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" -o "$RUNNER_TEMP/godot.zip"
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $RUNNER_TEMP/godot.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64"
      - name: Import Godot project
        run: |
          "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --headless --path godot --editor --import --quit
      - name: Generate and re-import ten genuine GLB mesh assets
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --headless --path godot --script res://tests/export_surface_zenith_assets.gd
          test "$(find "$ALCHUL_ZENITH_GLB_DIR" -name '*.glb' -type f | wc -l)" -eq 10
      - name: Render ten native Godot views using the exported GLBs
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1360x840x24' "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --path godot --rendering-method gl_compatibility --script res://tests/render_surface_zenith.gd
          test "$(find "$ALCHUL_ZENITH_CAPTURES" -name '*.png' -type f | wc -l)" -eq 10
      - name: Archive mesh library
        uses: actions/upload-artifact@v4
        with:
          name: ALCHUL_Surface_Zenith_GLBS
          path: zenith-glb/
          if-no-files-found: error
      - name: Archive ten true Godot renders
        uses: actions/upload-artifact@v4
        with:
          name: ALCHUL_Surface_Zenith_Native_Renders
          path: zenith-renders/
          if-no-files-found: error
      - name: Archive editable Godot source
        uses: actions/upload-artifact@v4
        with:
          name: ALCHUL_Surface_Zenith_Source
          path: |
            godot/scripts/surface_zenith*.gd
            godot/scenes/surface_zenith*.tscn
            godot/tests/*surface_zenith*.gd
            MEDIA/SURFACE_ZENITH_CONCEPT_TO_3D.md
            .github/workflows/alchul-surface-zenith.yml
          if-no-files-found: error
